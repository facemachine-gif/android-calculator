<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Android-Калькулятор (Инженерный режим + RU/EN)</title>
  <style>
    :root {
      --bg: #0B1120;
      --surface: #111827;
      --surface-variant: rgba(30, 41, 59, 0.78);
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --primary: #38BDF8;
      --primary-container: rgba(2, 132, 199, 0.68);
      --on-primary-container: #E0F2FE;
      --secondary-container: rgba(30, 41, 59, 0.64);
      --on-secondary-container: #E2E8F0;
      --tertiary-container: rgba(40, 53, 72, 0.68);
      --on-tertiary-container: #7DD3FC;
      --error-container: rgba(127, 29, 29, 0.68);
      --on-error-container: #FECACA;
      --border: rgba(255, 255, 255, 0.22);
      --glow-color: rgba(232, 244, 255, 0.62);
      --btn-radius: 18px;
    }
    [data-theme="light"] {
      --bg: #F1F5F9;
      --surface: #FFFFFF;
      --surface-variant: rgba(226, 232, 240, 0.85);
      --text: #0F172A;
      --text-muted: #475569;
      --primary: #0284C7;
      --primary-container: rgba(2, 132, 199, 0.76);
      --on-primary-container: #FFFFFF;
      --secondary-container: rgba(226, 232, 240, 0.74);
      --on-secondary-container: #0F172A;
      --tertiary-container: rgba(186, 230, 253, 0.76);
      --on-tertiary-container: #0369A1;
      --error-container: rgba(254, 226, 226, 0.78);
      --on-error-container: #B91C1C;
      --border: rgba(15, 23, 42, 0.16);
      --glow-color: rgba(13, 43, 107, 0.52);
    }
    * { box-sizing: border-box; user-select: none; }
    body {
      margin: 0; padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #060913; color: var(--text);
      display: flex; justify-content: center; align-items: center; min-height: 100vh;
    }
    .phone-frame {
      width: 100%; max-width: 400px; height: 760px;
      background: var(--bg); color: var(--text);
      border-radius: 36px; padding: 16px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.55), 0 0 0 1px var(--border);
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .top-bar { display: flex; gap: 8px; }
    .tonal-btn {
      flex: 1; border: 1px solid var(--border);
      background: var(--surface-variant); color: var(--text);
      padding: 8px 6px; border-radius: 999px;
      font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .panel-card {
      margin-top: 8px; background: var(--surface-variant);
      border: 1px solid var(--border); border-radius: 20px;
      padding: 12px; display: none; flex-direction: column; gap: 8px;
    }
    .panel-card.open { display: flex; }
    .chip-row { display: flex; gap: 6px; align-items: center; }
    .chip {
      flex: 1; padding: 6px 4px; font-size: 11px; font-weight: 600;
      text-align: center; border-radius: 10px; border: 1px solid var(--border);
      cursor: pointer;
    }
    .chip.active { background: var(--primary-container); color: var(--on-primary-container); }
    .swatch {
      width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: bold; font-size: 14px;
      border: 2px solid rgba(255,255,255,0.4);
    }
    .swatch.active { border-color: #fff; transform: scale(1.1); }
    .display-area {
      flex: 1; display: flex; flex-direction: column;
      justify-content: flex-end; align-items: flex-end; padding: 6px 4px;
    }
    .expr-text { font-size: 40px; font-weight: 300; text-align: right; word-break: break-all; }
    .preview-text { font-size: 20px; color: var(--text-muted); min-height: 26px; }
    .utility-row { width: 100%; display: flex; justify-content: space-between; margin-top: 4px; }
    .keypad-box {
      width: 100%; height: 420px;
      display: grid; gap: 8px;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(5, 1fr);
      transition: all 0.3s ease;
    }
    .keypad-box.sci {
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(6, 1fr);
    }
    .calc-btn {
      width: 100%; height: 100%;
      border-radius: var(--btn-radius);
      border: 1.3px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(0,0,0,0.12)), var(--secondary-container);
      color: var(--on-secondary-container);
      font-size: 20px; font-weight: 500; cursor: pointer;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.35), 0 4px 10px rgba(0,0,0,0.22);
      transition: transform 0.1s ease, box-shadow 0.12s ease, border-radius 0.2s ease;
      justify-self: center; align-self: center;
    }
    .round-mode .calc-btn {
      width: auto; height: 100%; aspect-ratio: 1 / 1; border-radius: 50%;
    }
    .calc-btn:active {
      transform: scale(0.95);
      box-shadow: 0 0 18px 4px var(--glow-color), inset 0 0 14px var(--glow-color);
    }
  </style>
</head>
<body>
  <div class="phone-frame" id="app">
    <div class="top-bar">
      <button class="tonal-btn" id="historyBtn" onclick="togglePanel('history')">История (0)</button>
      <button class="tonal-btn" id="sciBtn" onclick="toggleSci()">f(x) Инж.</button>
      <button class="tonal-btn" id="settingsBtn" onclick="togglePanel('settings')">⚙ Настройки</button>
    </div>
    <div class="panel-card" id="historyPanel">
      <div id="historyList" style="font-size:13px;color:var(--text-muted);text-align:center;">Пока нет вычислений</div>
    </div>
    <div class="panel-card" id="settingsPanel">
      <div class="chip-row">
        <span style="font-size:12px;color:var(--text-muted);flex:1;" id="langLabel">Язык</span>
        <div class="chip active" id="lang-ru" onclick="setLang('ru')">RU</div>
        <div class="chip" id="lang-en" onclick="setLang('en')">EN</div>
      </div>
      <div class="chip-row" style="justify-content:space-evenly;padding:4px 0;">
        <div class="swatch active" style="background:linear-gradient(135deg,#38BDF8,#0284C7)" onclick="setPalette('#38BDF8','rgba(2,132,199,0.68)',this)">✓</div>
        <div class="swatch" style="background:linear-gradient(135deg,#34D399,#059669)" onclick="setPalette('#34D399','rgba(5,150,105,0.68)',this)"></div>
        <div class="swatch" style="background:linear-gradient(135deg,#C084FC,#7C3AED)" onclick="setPalette('#C084FC','rgba(124,58,237,0.68)',this)"></div>
        <div class="swatch" style="background:linear-gradient(135deg,#FBBF24,#D97706)" onclick="setPalette('#FBBF24','rgba(217,119,6,0.68)',this)"></div>
        <div class="swatch" style="background:linear-gradient(135deg,#FB7185,#E11D48)" onclick="setPalette('#FB7185','rgba(225,29,72,0.68)',this)"></div>
      </div>
      <div class="chip-row">
        <div class="chip" id="shape-round" onclick="setShape('round')">Круглые</div>
        <div class="chip active" id="shape-rounded" onclick="setShape('rounded')">Скруглённые</div>
        <div class="chip" id="shape-square" onclick="setShape('square')">Квадратные</div>
      </div>
    </div>
    <div class="display-area">
      <div class="expr-text" id="exprDisplay">0</div>
      <div class="preview-text" id="previewDisplay"></div>
    </div>
    <div class="keypad-box" id="keypadBox"></div>
  </div>
  <script>
    let sci = false, lang = 'ru', expr = '';
    const mainRows = [
      ['AC','( )','%','÷'],
      ['7','8','9','×'],
      ['4','5','6','−'],
      ['1','2','3','+'],
      ['00','0','.','=']
    ];
    const topSci = ['DEG','sin','cos','tan','ln'];
    const leftSci = ['√x','xʸ','log','n!','π'];
    function renderKeypad() {
      const box = document.getElementById('keypadBox');
      box.classList.toggle('sci', sci);
      const items = [];
      if (sci) topSci.forEach(k => items.push(k));
      mainRows.forEach((row, r) => {
        if (sci) items.push(leftSci[r]);
        row.forEach(k => items.push(k));
      });
      box.innerHTML = items.map(k => `<button class="calc-btn" onclick="press('${k}')">${k}</button>`).join('');
    }
    function toggleSci() { sci = !sci; renderKeypad(); }
    function togglePanel(p) {
      document.getElementById(p === 'history' ? 'historyPanel' : 'settingsPanel').classList.toggle('open');
    }
    function setLang(l) {
      lang = l;
      document.getElementById('lang-ru').classList.toggle('active', l==='ru');
      document.getElementById('lang-en').classList.toggle('active', l==='en');
      document.getElementById('historyBtn').textContent = l==='ru' ? 'История (0)' : 'History (0)';
      document.getElementById('sciBtn').textContent = l==='ru' ? 'f(x) Инж.' : 'f(x) Sci';
      document.getElementById('settingsBtn').textContent = l==='ru' ? '⚙ Настройки' : '⚙ Settings';
    }
    function setPalette(p, pc, el) {
      document.documentElement.style.setProperty('--primary', p);
      document.documentElement.style.setProperty('--primary-container', pc);
      document.querySelectorAll('.swatch').forEach(s => { s.classList.remove('active'); s.textContent = ''; });
      el.classList.add('active'); el.textContent = '✓';
    }
    function setShape(s) {
      const box = document.getElementById('keypadBox');
      box.classList.toggle('round-mode', s === 'round');
      document.documentElement.style.setProperty('--btn-radius', s === 'square' ? '5px' : '18px');
      ['round','rounded','square'].forEach(k => document.getElementById('shape-'+k).classList.toggle('active', k===s));
    }
    function press(k) {
      if (k === 'AC') expr = '';
      else expr += k;
      document.getElementById('exprDisplay').textContent = expr || '0';
    }
    renderKeypad();
  </script>
</body>
</html>
