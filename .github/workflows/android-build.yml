      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Unit Tests & Assemble Debug APK
        run: gradle test assembleDebug --no-daemon

      - name: Rename APK for easy mobile download
        run: cp app/build/outputs/apk/debug/app-debug.apk Calculator-Android-debug.apk

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-Android-APK
          path: Calculator-Android-debug.apk

      - name: Publish Direct APK Download in GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Калькулятор Android v1.0.${{ github.run_number }} (Готовый APK)"
          body: |
            ### Готовый установочный файл для Android
            Нажмите на **`Calculator-Android-debug.apk`** ниже в разделе **Assets**, чтобы сразу скачать и установить приложение на телефон (Android 8.0 – Android 15).
          files: Calculator-Android-debug.apk
